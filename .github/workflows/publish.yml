name: Publish

# 发布一个 GitHub release 就把同版本发到 npm。npm 端的 trusted publisher 只认这个文件名和
# npm 环境;npm 环境要维护者批准才开跑,所以有写权限的人建 release 也发不出去。
on:
  release:
    types: [published]

concurrency:
  group: publish
  cancel-in-progress: false

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Node 22 自带 npm 10;trusted publishing 要 npm 11.5.1 起。
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Check tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm test

      - name: Publish
        run: pnpm run publish:package --publish
